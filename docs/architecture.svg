<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" role="img" aria-label="Deckhand architecture: browsers stream audio and REST calls to the FastAPI+ADK service on Cloud Run, which talks to Gemini on Vertex AI, keeps state in Firestore, and enqueues Pub/Sub jobs that a worker service turns into real Google Workspace actions.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#1f2430}
    .t{font-size:13px;font-weight:700}
    .b{font-size:11.5px}
    .l{font-size:11px;fill:#3c4043}
    .box{fill:#f7f8fc;stroke:#9aa0b4;stroke-width:1.2;rx:10}
    .hub{fill:#eef0ff;stroke:#5b67f2;stroke-width:1.6;rx:12}
    .edge{stroke:#3c4043;stroke-width:1.4;fill:none;marker-end:url(#arr)}
  </style>
  <rect x="0" y="0" width="1040" height="660" fill="#ffffff"/>
  <text x="20" y="26" class="t" font-size="16">Deckhand — Cloud Run · Vertex AI Gemini · Firestore · Pub/Sub</text>

  <!-- clients -->
  <rect x="20" y="60" width="180" height="66" class="box" rx="10"/>
  <text x="110" y="84" class="t" text-anchor="middle">deckhand-web</text>
  <text x="110" y="102" class="b" text-anchor="middle">Next.js UI · Cloud Run</text>

  <rect x="20" y="170" width="180" height="104" class="box" rx="10"/>
  <text x="110" y="194" class="t" text-anchor="middle">Browsers</text>
  <text x="110" y="212" class="b" text-anchor="middle">presenter + guests</text>
  <text x="110" y="228" class="b" text-anchor="middle">(invite link = the invite)</text>
  <text x="110" y="246" class="b" text-anchor="middle">mic / Meet-tab audio</text>
  <text x="110" y="262" class="b" text-anchor="middle">→ PCM16 @ 16 kHz</text>

  <line x1="110" y1="170" x2="110" y2="132" class="edge"/>
  <text x="118" y="152" class="l">loads UI</text>

  <!-- api hub -->
  <rect x="330" y="60" width="250" height="290" class="hub" rx="12"/>
  <text x="455" y="86" class="t" text-anchor="middle">deckhand-api · Cloud Run</text>
  <text x="455" y="104" class="b" text-anchor="middle">FastAPI + Google ADK</text>
  <line x1="346" y1="116" x2="564" y2="116" stroke="#c3c8f0" stroke-width="1"/>
  <text x="346" y="138" class="b">Agents: conductor · composer</text>
  <text x="346" y="155" class="b">intake · planner · note-taker</text>
  <text x="346" y="180" class="b">Gemini Live broker (WebSocket)</text>
  <text x="346" y="197" class="b">+ PCM transcription fallback</text>
  <text x="346" y="222" class="b">Session tools: web_search ·</text>
  <text x="346" y="239" class="b">drive_read · calendar_hold ·</text>
  <text x="346" y="256" class="b">gmail_draft · slides_export</text>
  <text x="346" y="281" class="b">Guest identity · Google OAuth</text>
  <text x="346" y="298" class="b">(secret in Secret Manager)</text>
  <text x="346" y="323" class="b">OpenTelemetry → Cloud Trace</text>

  <!-- browser to api -->
  <line x1="200" y1="196" x2="330" y2="160" class="edge"/>
  <text x="212" y="168" class="l">REST: utterances · decks · jobs</text>
  <line x1="200" y1="240" x2="330" y2="240" class="edge"/>
  <line x1="330" y1="256" x2="200" y2="256" class="edge"/>
  <text x="212" y="234" class="l">WS: live audio</text>
  <text x="212" y="274" class="l">captions · notes · navigate</text>

  <!-- right column -->
  <rect x="700" y="60" width="320" height="104" class="box"/>
  <text x="860" y="84" class="t" text-anchor="middle">Vertex AI — Gemini</text>
  <text x="860" y="104" class="b" text-anchor="middle">gemini-3.5-flash — every agent</text>
  <text x="860" y="121" class="b" text-anchor="middle">gemini-live-2.5-flash — live captions</text>
  <text x="860" y="138" class="b" text-anchor="middle">gemini-3.1-flash-image — page visuals</text>

  <line x1="580" y1="112" x2="700" y2="112" class="edge"/>
  <text x="588" y="104" class="l">generate · live sessions</text>

  <rect x="700" y="196" width="320" height="52" class="box"/>
  <text x="860" y="217" class="t" text-anchor="middle">Firestore</text>
  <text x="860" y="234" class="b" text-anchor="middle">workspaces · deck versions · talks · preference profiles</text>
  <line x1="580" y1="222" x2="700" y2="222" class="edge"/>
  <text x="600" y="214" class="l">state (realtime to UI)</text>

  <rect x="700" y="280" width="320" height="48" class="box"/>
  <text x="860" y="300" class="t" text-anchor="middle">Cloud Storage</text>
  <text x="860" y="317" class="b" text-anchor="middle">generated media · PDF / PPTX exports</text>
  <line x1="580" y1="300" x2="700" y2="300" class="edge"/>

  <rect x="700" y="360" width="320" height="120" class="box"/>
  <text x="860" y="384" class="t" text-anchor="middle">Google Workspace APIs</text>
  <text x="860" y="402" class="b" text-anchor="middle">acting as the user via their OAuth grant</text>
  <text x="860" y="424" class="b" text-anchor="middle">Drive + Sheets read · Slides create</text>
  <text x="860" y="441" class="b" text-anchor="middle">Gmail drafts + send · Calendar events · Tasks</text>
  <text x="860" y="463" class="b" text-anchor="middle">(nothing sends without a human pressing send)</text>

  <polyline points="580,336 646,336 646,400 700,400" class="edge"/>
  <text x="592" y="356" class="l">live tool calls</text>

  <!-- pubsub + worker -->
  <line x1="455" y1="350" x2="455" y2="392" class="edge"/>
  <text x="463" y="376" class="l">Stop / Lock ⇒ job</text>
  <rect x="380" y="392" width="150" height="46" class="box"/>
  <text x="455" y="411" class="t" text-anchor="middle">Pub/Sub</text>
  <text x="455" y="428" class="b" text-anchor="middle">deckhand-jobs</text>
  <line x1="455" y1="438" x2="455" y2="478" class="edge"/>
  <text x="463" y="462" class="l">push (OIDC)</text>

  <rect x="320" y="478" width="270" height="128" class="hub"/>
  <text x="455" y="502" class="t" text-anchor="middle">deckhand-worker · Cloud Run</text>
  <text x="455" y="520" class="b" text-anchor="middle">asynchronous, idempotent pipeline</text>
  <line x1="336" y1="530" x2="574" y2="530" stroke="#c3c8f0" stroke-width="1"/>
  <text x="336" y="550" class="b">Slides export → recap → email</text>
  <text x="336" y="567" class="b">Tasks + Calendar follow-ups</text>
  <text x="336" y="584" class="b">suggested edits for version N+1</text>
  <text x="336" y="601" class="b">preference-profile merge</text>

  <polyline points="590,540 646,540 646,480 700,480" class="edge"/>
  <text x="600" y="532" class="l">acts as the user</text>

  <text x="20" y="644" class="l">Every reasoning step runs on Gemini 3.5 Flash. The worker survives redelivery: each pipeline step checkpoints to Firestore, so a crash never double-sends an email.</text>
</svg>
