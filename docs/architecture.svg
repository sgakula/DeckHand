<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" width="1140" height="700" role="img" aria-label="Deckhand architecture. A browser calls one Cloud Run service that runs two containers — a Next.js UI plus API proxy, and a FastAPI ADK sidecar — over localhost. The sidecar runs Gemini 3.5 Flash agents on Vertex AI, keeps state in Firestore, and calls Google Workspace APIs live. Stopping a session enqueues a Pub/Sub job that a separate worker service turns into a Slides export, recap email, calendar holds and tasks, with every step checkpointed so redelivery cannot double-send.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4250"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4530a"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;fill:#16181f}
    .h{font-size:15px;font-weight:700}
    .n{font-size:12.5px;font-weight:700}
    .b{font-size:11.5px;fill:#3d4250}
    .l{font-size:11px;fill:#3d4250;font-weight:600}
    .m{font-size:10.5px;fill:#6b7180}
    .box{fill:#f6f7fb;stroke:#a3a9bb;stroke-width:1.1}
    .ctr{fill:#fff;stroke:#5b67f2;stroke-width:1.3}
    .svc{fill:#eef0ff;stroke:#5b67f2;stroke-width:1.8}
    .async{fill:#fdf3ea;stroke:#b4530a;stroke-width:1.3}
    .e{stroke:#3d4250;stroke-width:1.4;fill:none;marker-end:url(#a)}
    .ea{stroke:#b4530a;stroke-width:1.5;fill:none;marker-end:url(#aw)}
  </style>
  <rect width="1140" height="700" fill="#fff"/>

  <text x="32" y="30" class="h">Deckhand — Gemini 3.5 Flash · Google ADK · Cloud Run · Firestore · Pub/Sub</text>
  <text x="32" y="50" class="m">One session forks into a fast loop the room watches, and a slow pipeline that does the real work after everyone leaves.</text>

  <!-- browser -->
  <rect x="32" y="86" width="222" height="132" rx="10" class="box"/>
  <text x="143" y="110" class="n" text-anchor="middle">Browser</text>
  <text x="143" y="130" class="b" text-anchor="middle">presenter + invited guests</text>
  <text x="143" y="150" class="b" text-anchor="middle">mic → 16 kHz PCM16</text>
  <text x="143" y="168" class="b" text-anchor="middle">or typed turns</text>
  <text x="143" y="192" class="m" text-anchor="middle">link = the invite;</text>
  <text x="143" y="207" class="m" text-anchor="middle">guest id, no sign-up</text>

  <line x1="254" y1="140" x2="316" y2="140" class="e"/>
  <text x="285" y="130" class="l" text-anchor="middle">HTTPS</text>
  <text x="285" y="160" class="m" text-anchor="middle">same origin</text>

  <!-- cloud run service: two containers -->
  <rect x="316" y="72" width="452" height="240" rx="12" class="svc"/>
  <text x="542" y="96" class="n" text-anchor="middle">Cloud Run · deckhand-web</text>
  <text x="542" y="114" class="m" text-anchor="middle">one instance, two containers</text>

  <rect x="334" y="130" width="196" height="164" rx="9" class="ctr"/>
  <text x="432" y="154" class="n" text-anchor="middle">web</text>
  <text x="432" y="174" class="b" text-anchor="middle">Next.js UI</text>
  <text x="432" y="192" class="b" text-anchor="middle">+ /api/deckhand proxy</text>
  <text x="432" y="216" class="m" text-anchor="middle">ingress :8080</text>
  <text x="432" y="248" class="m" text-anchor="middle">same-origin proxy =</text>
  <text x="432" y="263" class="m" text-anchor="middle">no CORS, no preflight</text>

  <rect x="554" y="130" width="196" height="164" rx="9" class="ctr"/>
  <text x="652" y="154" class="n" text-anchor="middle">api</text>
  <text x="652" y="174" class="b" text-anchor="middle">FastAPI + ADK</text>
  <text x="652" y="194" class="b" text-anchor="middle">conductor → composer</text>
  <text x="652" y="212" class="b" text-anchor="middle">note-taker · tools</text>
  <text x="652" y="236" class="m" text-anchor="middle">sidecar :8090</text>
  <text x="652" y="262" class="m" text-anchor="middle">starts first (probe)</text>

  <line x1="530" y1="196" x2="554" y2="196" class="e"/>
  <text x="542" y="186" class="l" text-anchor="middle">localhost</text>

  <!-- right dependencies -->
  <rect x="826" y="86" width="282" height="86" rx="10" class="box"/>
  <text x="967" y="110" class="n" text-anchor="middle">Vertex AI — Gemini</text>
  <text x="967" y="130" class="b" text-anchor="middle">3.5 Flash · every agent turn</text>
  <text x="967" y="148" class="b" text-anchor="middle">Live captions · image generation</text>
  <text x="967" y="164" class="m" text-anchor="middle">quota-aware model fallback chain</text>

  <rect x="826" y="190" width="282" height="80" rx="10" class="box"/>
  <text x="967" y="214" class="n" text-anchor="middle">Firestore</text>
  <text x="967" y="234" class="b" text-anchor="middle">workspaces · pages · notes</text>
  <text x="967" y="252" class="b" text-anchor="middle">deck versions · preference profile</text>
  <text x="967" y="266" class="m" text-anchor="middle">the memory that survives the session</text>

  <line x1="768" y1="128" x2="826" y2="128" class="e"/>
  <text x="797" y="120" class="l" text-anchor="middle">turns</text>
  <line x1="768" y1="228" x2="826" y2="228" class="e"/>
  <text x="797" y="220" class="l" text-anchor="middle">state</text>

  <!-- workspace apis -->
  <rect x="826" y="330" width="282" height="176" rx="10" class="box"/>
  <text x="967" y="354" class="n" text-anchor="middle">Google Workspace</text>
  <text x="967" y="372" class="m" text-anchor="middle">acting as the user, via their OAuth grant</text>
  <text x="850" y="398" class="b">Drive + Sheets — read, cite the cell</text>
  <text x="850" y="418" class="b">Slides — create the deck</text>
  <text x="850" y="438" class="b">Gmail — draft, never auto-send</text>
  <text x="850" y="458" class="b">Calendar · Tasks — hold and follow up</text>
  <text x="850" y="484" class="m">no grant → the same actions still run,</text>
  <text x="850" y="499" class="m">producing .ics / .eml / .pptx files</text>

  <path d="M750 294 C 800 320, 800 340, 826 372" class="e"/>
  <text x="778" y="352" class="l" text-anchor="end">live tool calls</text>

  <!-- async lane -->
  <path d="M652 294 L652 348 L620 348" class="ea"/>
  <text x="664" y="326" class="l" fill="#b4530a">on Stop / Lock</text>

  <rect x="380" y="326" width="240" height="44" rx="9" class="async"/>
  <text x="500" y="354" class="n" text-anchor="middle">Pub/Sub — deckhand-jobs</text>

  <path d="M500 370 L500 408" class="ea"/>
  <text x="510" y="392" class="l" fill="#b4530a">push (OIDC)</text>

  <rect x="316" y="408" width="452" height="150" rx="12" class="async"/>
  <text x="542" y="432" class="n" text-anchor="middle">Cloud Run · deckhand-worker</text>
  <text x="542" y="450" class="m" text-anchor="middle">runs after the browser is closed</text>
  <text x="338" y="476" class="b">export deck → write recap → email attendees</text>
  <text x="338" y="496" class="b">→ create tasks &amp; calendar follow-ups</text>
  <text x="338" y="516" class="b">→ suggest edits for version N+1 → merge preferences</text>
  <text x="338" y="542" class="m">every step checkpointed in Firestore: a crash or Pub/Sub redelivery</text>
  <text x="338" y="555" class="m">resumes where it stopped and never double-sends an email</text>

  <path d="M768 466 L826 424" class="ea"/>
  <text x="800" y="458" class="l" fill="#b4530a" text-anchor="middle">acts</text>

  <path d="M768 424 C 796 400, 800 320, 826 286" class="ea" stroke-dasharray="5 4"/>
  <text x="806" y="316" class="l" fill="#b4530a" text-anchor="end">results</text>
  <text x="542" y="580" class="m" text-anchor="middle">…and the team opens the debrief page: recap, follow-ups, and suggested edits for the next version.</text>

  <!-- credentials footer -->
  <rect x="32" y="600" width="1076" height="66" rx="10" fill="#f6f7fb" stroke="#a3a9bb" stroke-width="1.1"/>
  <text x="50" y="624" class="n">Credentials &amp; isolation</text>
  <text x="50" y="644" class="b">OAuth client secret → Secret Manager, mounted at runtime · user refresh tokens → Firestore under rules that deny every client read</text>
  <text x="50" y="660" class="b">dedicated service account per service · agents reach Gemini through the service account, never a shipped API key · OpenTelemetry → Cloud Trace</text>
</svg>
